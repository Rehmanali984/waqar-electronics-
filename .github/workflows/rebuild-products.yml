name: Rebuild products.js from data

on:
  push:
    branches: [main]
    paths:
      - "data/categories/**"
      - "data/products/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate js/products.js
        run: node scripts/build-products-js.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/products.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-rebuild products.js from admin edits [skip ci]"
            git push
          else
            echo "No changes to products.js"
          fi
